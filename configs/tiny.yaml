seed: 1337
device: cpu
model:
  name: tiny
  image_height: 32
  channels: [48, 96, 160, 192]
  separable: true
  rnn_hidden: 320
  rnn_layers: 2
  rnn_dropout: 0.1
  proj_size: 320
data:
  train_samples: 8000
  val_samples: 800
  font_size_min: 15
  font_size_max: 34
  max_chars: 42
  augment: true
  max_width: 1280
train:
  epochs: 12
  batch_size: 32
  lr: 0.001
  weight_decay: 0.01
  grad_clip: 5.0
  warmup_steps: 150
  early_stopping_patience: 5
  checkpoint_dir: artifacts/checkpoints/tiny
  log_every: 20
  save_every: 5
  amp: false
  num_workers: 0
