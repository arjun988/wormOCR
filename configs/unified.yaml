# Phase 3, stage 1: one recognizer for printed and handwritten lines.
# Same architecture as wormocr-2M and initialized from its weights, so every
# tensor transfers at image_height 32. GPU only: device cuda fails fast without CUDA.
# Training data is limited to commercially usable licenses (see plan.md 3.0a).
# IAM and RxHand are evaluation-only and must never appear in `sources`.
seed: 2026
device: cuda
model:
  name: wormocr-unified
  image_height: 32
  width_stride: 4
  channels: [48, 96, 160, 192]
  separable: true
  rnn_hidden: 256
  rnn_layers: 2
  rnn_dropout: 0.0
  proj_size: 256
data:
  train_samples: 4000000
  val_per_source: 300
  font_size_min: 14
  font_size_max: 36
  max_chars: 40
  augment: true
  max_width: 1600
  handwriting_font_dir: artifacts/fonts/handwriting
  sources:
    - {name: printed_synth, kind: synthetic, weight: 0.30}
    - {name: handwriting_synth, kind: handwriting, weight: 0.30}
    - name: gnhk
      kind: labels
      weight: 0.15
      labels: artifacts/datasets/prepared/gnhk/train.tsv
      val_labels: artifacts/datasets/prepared/gnhk/val.tsv
    - name: hw_names
      kind: labels
      weight: 0.10
      labels: artifacts/datasets/prepared/hw_names/train.tsv
      val_labels: artifacts/datasets/prepared/hw_names/val.tsv
    - name: bentham
      kind: labels
      weight: 0.10
      labels: artifacts/datasets/prepared/bentham/train.tsv
      val_labels: artifacts/datasets/prepared/bentham/val.tsv
    - name: cord
      kind: labels
      weight: 0.05
      labels: artifacts/datasets/prepared/cord/train.tsv
      val_labels: artifacts/datasets/prepared/cord/val.tsv
train:
  init_from: wormocr-2M
  epochs: 1
  batch_size: 64
  lr: 0.0008
  min_lr_ratio: 0.05
  weight_decay: 0.0001
  grad_clip: 5.0
  warmup_steps: 500
  max_steps: 60000
  max_minutes: 420
  early_stopping_patience: 0
  checkpoint_dir: artifacts/checkpoints/unified
  log_every: 100
  save_every: 0
  amp: true
  num_workers: 14
  torch_threads: 12
  ema_decay: 0.999
  eval_every: 1000
